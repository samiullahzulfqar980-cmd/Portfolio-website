<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fp-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="fp-card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="fp-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#fp-bg)" rx="16"/>
  <circle cx="650" cy="120" r="180" fill="url(#fp-glow)"/>
  <circle cx="150" cy="400" r="140" fill="url(#fp-glow)"/>

  <!-- Left Side: Mobile Phone Mockup -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="230" height="420" rx="36" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <!-- Screen -->
    <rect x="10" y="10" width="210" height="400" rx="28" fill="#090d16"/>
    <!-- Dynamic Island / Notch -->
    <rect x="75" y="18" width="60" height="14" rx="7" fill="#1e293b"/>
    
    <!-- App Header -->
    <circle cx="34" cy="48" r="12" fill="#6366f1" opacity="0.3"/>
    <text x="34" y="52" fill="#818cf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SZ</text>
    <text x="56" y="47" fill="#94a3b8" font-family="sans-serif" font-size="9">Total Balance</text>
    <text x="56" y="58" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">$48,920.50</text>
    <circle cx="196" cy="48" r="10" fill="#1e293b"/>
    <path d="M193 45 h6 v6 h-6 z" fill="#94a3b8"/>

    <!-- Credit Card Widget -->
    <rect x="20" y="74" width="190" height="105" rx="14" fill="url(#fp-card)"/>
    <text x="35" y="96" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">FinPulse Black</text>
    <text x="185" y="96" fill="#ffffff" font-family="sans-serif" font-size="10" opacity="0.8">VISA</text>
    <text x="35" y="132" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="2">••••  ••••  ••••  8942</text>
    <text x="35" y="162" fill="#ffffff" font-family="sans-serif" font-size="9" opacity="0.8">EXP 09/28</text>
    <text x="160" y="162" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">ACTIVE</text>

    <!-- Action Buttons -->
    <g transform="translate(20, 192)">
      <rect x="0" y="0" width="55" height="34" rx="10" fill="#1e293b"/>
      <text x="27" y="18" fill="#818cf8" font-family="sans-serif" font-size="12" text-anchor="middle">↑</text>
      <text x="27" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="7" text-anchor="middle">Send</text>

      <rect x="67" y="0" width="55" height="34" rx="10" fill="#1e293b"/>
      <text x="94" y="18" fill="#34d399" font-family="sans-serif" font-size="12" text-anchor="middle">↓</text>
      <text x="94" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="7" text-anchor="middle">Receive</text>

      <rect x="135" y="0" width="55" height="34" rx="10" fill="#1e293b"/>
      <text x="162" y="18" fill="#f59e0b" font-family="sans-serif" font-size="12" text-anchor="middle">⇄</text>
      <text x="162" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="7" text-anchor="middle">Swap</text>
    </g>

    <!-- Crypto Assets List -->
    <text x="22" y="246" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">CRYPTO ASSETS</text>

    <!-- BTC -->
    <rect x="20" y="256" width="190" height="42" rx="10" fill="#131d2e"/>
    <circle cx="38" cy="277" r="11" fill="#f59e0b"/>
    <text x="38" y="281" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">₿</text>
    <text x="56" y="274" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold">Bitcoin</text>
    <text x="56" y="285" fill="#10b981" font-family="sans-serif" font-size="8">+5.42%</text>
    <text x="195" y="274" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">$67,420</text>
    <text x="195" y="285" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="end">0.45 BTC</text>

    <!-- ETH -->
    <rect x="20" y="306" width="190" height="42" rx="10" fill="#131d2e"/>
    <circle cx="38" cy="327" r="11" fill="#6366f1"/>
    <text x="38" y="331" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ξ</text>
    <text x="56" y="324" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold">Ethereum</text>
    <text x="56" y="335" fill="#10b981" font-family="sans-serif" font-size="8">+3.18%</text>
    <text x="195" y="324" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">$3,580</text>
    <text x="195" y="335" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="end">4.80 ETH</text>

    <!-- SOL -->
    <rect x="20" y="356" width="190" height="42" rx="10" fill="#131d2e"/>
    <circle cx="38" cy="377" r="11" fill="#14b8a6"/>
    <text x="38" y="381" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">S</text>
    <text x="56" y="374" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold">Solana</text>
    <text x="56" y="385" fill="#10b981" font-family="sans-serif" font-size="8">+12.4%</text>
    <text x="195" y="374" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">$178.50</text>
    <text x="195" y="385" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="end">28.5 SOL</text>
  </g>

  <!-- Right Side: Analytics & Web Dashboard Interface -->
  <g transform="translate(320, 50)" filter="url(#shadow)">
    <!-- Dashboard Window -->
    <rect x="0" y="0" width="430" height="400" rx="16" fill="#111827" stroke="#1f2937" stroke-width="2"/>
    <!-- Window Header -->
    <rect x="0" y="0" width="430" height="40" rx="16" fill="#1f2937"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="215" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">finpulse-analytics-dashboard.app</text>

    <!-- Overview Stats Grid -->
    <rect x="20" y="60" width="120" height="65" rx="10" fill="#1e293b"/>
    <text x="32" y="80" fill="#94a3b8" font-family="sans-serif" font-size="10">Monthly Volume</text>
    <text x="32" y="104" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold">$1.42M</text>
    <text x="32" y="117" fill="#10b981" font-family="sans-serif" font-size="9">▲ 18.2%</text>

    <rect x="155" y="60" width="120" height="65" rx="10" fill="#1e293b"/>
    <text x="167" y="80" fill="#94a3b8" font-family="sans-serif" font-size="10">Active Wallets</text>
    <text x="167" y="104" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold">42,850</text>
    <text x="167" y="117" fill="#10b981" font-family="sans-serif" font-size="9">▲ 24.8%</text>

    <rect x="290" y="60" width="120" height="65" rx="10" fill="#1e293b"/>
    <text x="302" y="80" fill="#94a3b8" font-family="sans-serif" font-size="10">Avg. Swap Time</text>
    <text x="302" y="104" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold">1.2s</text>
    <text x="302" y="117" fill="#38bdf8" font-family="sans-serif" font-size="9">Ultra Fast</text>

    <!-- Interactive Chart -->
    <rect x="20" y="140" width="390" height="150" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="165" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Portfolio Performance (30 Days)</text>
    <text x="385" y="165" fill="#818cf8" font-family="sans-serif" font-size="10" text-anchor="end">Live Feed</text>
    <circle cx="395" cy="161" r="3" fill="#10b981"/>

    <!-- Sparkline / Graph Area -->
    <path d="M 40 250 Q 80 230, 120 235 T 200 190 T 280 210 T 360 170 L 390 175" fill="none" stroke="#6366f1" stroke-width="3"/>
    <path d="M 40 250 Q 80 230, 120 235 T 200 190 T 280 210 T 360 170 L 390 175 L 390 270 L 40 270 Z" fill="url(#fp-glow)"/>

    <!-- Bottom Tech Pills -->
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="75" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="37" y="17" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Flutter</text>

      <rect x="85" y="0" width="65" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="117" y="17" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Dart</text>

      <rect x="160" y="0" width="75" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="197" y="17" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Firebase</text>

      <rect x="245" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="287" y="17" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Web3 / Ethers</text>

      <rect x="340" y="0" width="70" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="375" y="17" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Stripe</text>
    </g>

    <!-- Status Line -->
    <text x="25" y="370" fill="#64748b" font-family="sans-serif" font-size="11">Production Ready • Biometric Auth • 256-bit Encryption • Multi-chain</text>
  </g>
</svg>