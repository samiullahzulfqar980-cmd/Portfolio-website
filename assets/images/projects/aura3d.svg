<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="a3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#190d2e"/>
    </linearGradient>
    <linearGradient id="a3-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="a3-glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#a3-bg)" rx="16"/>

  <!-- Top E-Commerce Header -->
  <g transform="translate(50, 30)">
    <text x="0" y="25" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="2">AURA<tspan fill="#a855f7">3D</tspan></text>
    <text x="180" y="24" fill="#a1a1aa" font-family="sans-serif" font-size="11">Sneakers</text>
    <text x="260" y="24" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">Apparel</text>
    <text x="330" y="24" fill="#a1a1aa" font-family="sans-serif" font-size="11">Cyber Series</text>
    <text x="430" y="24" fill="#a1a1aa" font-family="sans-serif" font-size="11">Customizer</text>
    
    <rect x="620" y="5" width="80" height="28" rx="14" fill="#27272a"/>
    <text x="660" y="23" fill="#fafafa" font-family="sans-serif" font-size="10" text-anchor="middle">Cart (3)</text>
  </g>

  <!-- Central 3D Product Canvas Display -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="700" height="370" rx="16" fill="#0d0a1a" stroke="#2e1065" stroke-width="1.5"/>
    
    <!-- 3D Grid floor perspective -->
    <path d="M 100 320 L 600 320 M 150 280 L 550 280 M 200 240 L 500 240" stroke="#3b0764" stroke-width="1" opacity="0.6"/>
    <path d="M 200 240 L 100 320 M 350 240 L 350 320 M 500 240 L 600 320" stroke="#3b0764" stroke-width="1" opacity="0.6"/>

    <!-- 3D Ambient Ring -->
    <ellipse cx="350" cy="270" rx="180" ry="40" fill="none" stroke="url(#a3-neon)" stroke-width="2" opacity="0.7"/>

    <!-- Stylized Futuristic 3D Sneaker Silhouette / Model -->
    <g transform="translate(230, 130)">
      <!-- Sole -->
      <path d="M 30 110 C 60 120, 180 125, 230 100 C 240 90, 230 75, 200 80 C 150 90, 80 85, 30 100 Z" fill="url(#a3-neon)" filter="url(#a3-glow)"/>
      <!-- Upper Body -->
      <path d="M 40 95 C 60 60, 90 40, 130 50 C 160 40, 180 60, 215 75 C 220 85, 210 90, 190 92 C 140 85, 80 85, 40 95 Z" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
      <!-- Heel & Ankle collar -->
      <path d="M 50 85 C 45 60, 60 30, 85 25 C 105 20, 115 35, 120 50 Z" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/>
      <!-- Laces / Details -->
      <line x1="95" y1="40" x2="135" y2="55" stroke="#38bdf8" stroke-width="3"/>
      <line x1="105" y1="52" x2="145" y2="67" stroke="#38bdf8" stroke-width="3"/>
      <line x1="115" y1="64" x2="155" y2="79" stroke="#38bdf8" stroke-width="3"/>
    </g>

    <!-- 360 Rotation Badge -->
    <rect x="290" y="325" width="120" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="350" y="342" fill="#c7d2fe" font-family="sans-serif" font-size="10" text-anchor="middle">🔄 Drag to Rotate 360°</text>

    <!-- Left Info Panel -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="#701a75"/>
      <text x="40" y="14" fill="#f472b6" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">NEW DROP</text>
      
      <text x="0" y="55" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">CyberKicks</text>
      <text x="0" y="78" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="bold">Pro V2 Hologram</text>

      <text x="0" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">Interactive Three.js shader materials</text>
      <text x="0" y="128" fill="#94a3b8" font-family="sans-serif" font-size="11">with dynamic lighting &amp; physics.</text>

      <text x="0" y="170" fill="#cbd5e1" font-family="sans-serif" font-size="11">SELECT COLORWAY:</text>
      <circle cx="12" cy="190" r="10" fill="#ec4899" stroke="#fff" stroke-width="2"/>
      <circle cx="42" cy="190" r="10" fill="#8b5cf6"/>
      <circle cx="72" cy="190" r="10" fill="#06b6d4"/>
      <circle cx="102" cy="190" r="10" fill="#10b981"/>

      <text x="0" y="240" fill="#fff" font-family="sans-serif" font-size="24" font-weight="bold">$280.00</text>
      <rect x="0" y="258" width="140" height="38" rx="8" fill="url(#a3-neon)"/>
      <text x="70" y="282" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Right Specs Panel -->
    <g transform="translate(520, 40)">
      <rect x="0" y="0" width="140" height="150" rx="10" fill="#130e26" stroke="#2e1065"/>
      <text x="15" y="25" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold">3D ENGINE SPECS</text>
      
      <text x="15" y="50" fill="#f8fafc" font-family="sans-serif" font-size="10">FPS: <tspan fill="#34d399">60.0 Ultra</tspan></text>
      <text x="15" y="70" fill="#f8fafc" font-family="sans-serif" font-size="10">Triangles: <tspan fill="#94a3b8">48.2k</tspan></text>
      <text x="15" y="90" fill="#f8fafc" font-family="sans-serif" font-size="10">Shaders: <tspan fill="#94a3b8">PBR Metallic</tspan></text>
      <text x="15" y="110" fill="#f8fafc" font-family="sans-serif" font-size="10">Lighting: <tspan fill="#94a3b8">HDR Environment</tspan></text>
      <text x="15" y="130" fill="#f8fafc" font-family="sans-serif" font-size="10">Stack: <tspan fill="#38bdf8">React + Three.js</tspan></text>
    </g>
  </g>
</svg>