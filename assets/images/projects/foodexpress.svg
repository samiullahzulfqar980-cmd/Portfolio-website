<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="fe-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fe-bg)" rx="16"/>

  <!-- Left Mobile App: Order & Restaurant Selection -->
  <g transform="translate(100, 35)">
    <rect x="0" y="0" width="240" height="430" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <rect x="10" y="10" width="220" height="410" rx="28" fill="#09090b"/>
    
    <!-- Notch -->
    <rect x="80" y="16" width="60" height="14" rx="7" fill="#27272a"/>

    <!-- App Bar -->
    <text x="25" y="52" fill="#a1a1aa" font-family="sans-serif" font-size="9">Delivering to</text>
    <text x="25" y="66" fill="#fafafa" font-family="sans-serif" font-size="11" font-weight="bold">📍 Blue Area, Islamabad ▼</text>

    <!-- Search Bar -->
    <rect x="22" y="80" width="196" height="32" rx="10" fill="#27272a"/>
    <text x="36" y="100" fill="#71717a" font-family="sans-serif" font-size="10">🔍 Search burgers, sushi...</text>

    <!-- Category Chips -->
    <rect x="22" y="122" width="56" height="26" rx="13" fill="url(#fe-orange)"/>
    <text x="50" y="139" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🍔 All</text>

    <rect x="84" y="122" width="60" height="26" rx="13" fill="#27272a"/>
    <text x="114" y="139" fill="#d4d4d8" font-family="sans-serif" font-size="9" text-anchor="middle">🍕 Pizza</text>

    <rect x="150" y="122" width="60" height="26" rx="13" fill="#27272a"/>
    <text x="180" y="139" fill="#d4d4d8" font-family="sans-serif" font-size="9" text-anchor="middle">🍣 Asian</text>

    <!-- Featured Restaurant Card 1 -->
    <rect x="22" y="160" width="196" height="110" rx="12" fill="#18181b" stroke="#27272a"/>
    <rect x="22" y="160" width="196" height="60" rx="12" fill="#3f3f46"/>
    <text x="120" y="195" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Gourmet Burger Kitchen</text>
    <text x="32" y="240" fill="#fafafa" font-family="sans-serif" font-size="11" font-weight="bold">The Smokehouse Stack</text>
    <text x="32" y="256" fill="#f97316" font-family="sans-serif" font-size="10" font-weight="bold">$12.99 • 20-30 min</text>
    <text x="195" y="245" fill="#eab308" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">★ 4.9</text>

    <!-- Featured Restaurant Card 2 -->
    <rect x="22" y="282" width="196" height="110" rx="12" fill="#18181b" stroke="#27272a"/>
    <rect x="22" y="282" width="196" height="60" rx="12" fill="#2e1065"/>
    <text x="120" y="318" fill="#e9d5ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Tokyo Sushi &amp; Ramen</text>
    <text x="32" y="362" fill="#fafafa" font-family="sans-serif" font-size="11" font-weight="bold">Salmon Dragon Roll</text>
    <text x="32" y="378" fill="#f97316" font-family="sans-serif" font-size="10" font-weight="bold">$16.50 • 15-25 min</text>
    <text x="195" y="367" fill="#eab308" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">★ 4.8</text>
  </g>

  <!-- Right Mobile App: Live Tracking Screen -->
  <g transform="translate(420, 35)">
    <rect x="0" y="0" width="240" height="430" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <rect x="10" y="10" width="220" height="410" rx="28" fill="#09090b"/>

    <!-- Notch -->
    <rect x="80" y="16" width="60" height="14" rx="7" fill="#27272a"/>

    <!-- Live GPS Map View -->
    <rect x="10" y="10" width="220" height="230" rx="28" fill="#1c1917"/>
    <!-- Map streets simulation -->
    <path d="M 20 80 Q 90 70, 150 110 T 220 100" stroke="#44403c" stroke-width="8" fill="none"/>
    <path d="M 60 20 L 70 230" stroke="#44403c" stroke-width="8" fill="none"/>
    <path d="M 160 30 L 140 220" stroke="#44403c" stroke-width="8" fill="none"/>
    <!-- Delivery route path -->
    <path d="M 50 160 Q 90 110, 140 130" stroke="#f97316" stroke-width="4" stroke-dasharray="6,4" fill="none"/>
    <!-- Rider Pin -->
    <circle cx="140" cy="130" r="14" fill="#f97316"/>
    <text x="140" y="135" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle">🛵</text>
    <!-- Destination Pin -->
    <circle cx="50" cy="160" r="10" fill="#22c55e"/>
    <text x="50" y="164" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">🏠</text>

    <!-- Floating Tracking Sheet -->
    <rect x="18" y="220" width="204" height="190" rx="16" fill="#18181b" stroke="#27272a"/>
    <rect x="95" y="228" width="50" height="4" rx="2" fill="#52525b"/>

    <text x="32" y="254" fill="#fafafa" font-family="sans-serif" font-size="13" font-weight="bold">On the way!</text>
    <text x="32" y="270" fill="#f97316" font-family="sans-serif" font-size="11" font-weight="bold">Arriving in ~14 mins</text>

    <!-- Rider Profile -->
    <rect x="30" y="285" width="180" height="50" rx="10" fill="#27272a"/>
    <circle cx="55" cy="310" r="16" fill="#ea580c"/>
    <text x="55" y="314" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">H</text>
    <text x="80" y="306" fill="#fafafa" font-family="sans-serif" font-size="11" font-weight="bold">Hamza Khan</text>
    <text x="80" y="322" fill="#a1a1aa" font-family="sans-serif" font-size="9">Yamaha YBR • ★ 4.9</text>
    <circle cx="190" cy="310" r="12" fill="#22c55e"/>
    <text x="190" y="314" fill="#fff" font-family="sans-serif" font-size="10" text-anchor="middle">📞</text>

    <!-- Order summary line -->
    <text x="32" y="360" fill="#a1a1aa" font-family="sans-serif" font-size="9">Order #FE-8924</text>
    <text x="32" y="375" fill="#fafafa" font-family="sans-serif" font-size="10" font-weight="bold">2x Classic Cheese, 1x Truffle Fries</text>
    <text x="195" y="375" fill="#22c55e" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">PAID</text>
  </g>
</svg>